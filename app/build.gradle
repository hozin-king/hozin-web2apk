apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.hozinking.web2apk'
    compileSdk 34

    defaultConfig {
        applicationId "com.hozinking.web2apk"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Keystore debug PERSISTEN: file debug.keystore di root repo dipulihkan
    // workflow dari secret DEBUG_KEYSTORE_BASE64. Config dibuat kondisional
    // agar AGP tidak gagal validateSigningDebug bila file tidak ada.
    signingConfigs {
        if (file("../debug.keystore").exists()) {
            debug {
                storeFile file("../debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (file("../debug.keystore").exists()) {
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
