name: Build APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore persistent debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            echo "debug.keystore dipulihkan dari secret"
          else
            echo "DEBUG_KEYSTORE_BASE64 tidak ada - memakai keystore debug bawaan AGP"
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace -Pkotlin.compiler.execution.strategy=in-process

      - name: Create or update GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName\s+"[^"]+"' app/build.gradle | grep -oP '"[^"]+"' | tr -d '"')
          if [ -z "$VERSION" ]; then echo "versionName tidak ditemukan di app/build.gradle"; exit 1; fi
          TAG="v$VERSION"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" "HozinWeb2APK-Builder-$VERSION.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "HozinWeb2APK-Builder-$VERSION.apk" --clobber
          else
            gh release create "$TAG" "HozinWeb2APK-Builder-$VERSION.apk" --title "Hozin Web2APK Builder $VERSION" --notes "Builder HTML drag-and-drop (authoring murni). Export proyek sebagai ZIP berisi index.html + assets/. Bukan konverter ke APK."
          fi
